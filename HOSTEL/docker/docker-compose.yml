version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hostel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hostel_management
      POSTGRES_USER: hostel_user
      POSTGRES_PASSWORD: hostel_dev_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostel_user -d hostel_management"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
